<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KlabCenter — Gestion d’activité</title>
<meta name="description" content="KlabCenter : gestion des ventes, clients, produits, stocks, commandes, créances et trésorerie.">
<meta name="application-version" content="2026.08-final">

<!-- PWA : rend l'application installable comme une vraie appli -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#132C54">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KlabCenter">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0F2242;
    --navy-800:#132C54;
    --navy-700:#1B3E73;
    --blue-500:#2F6FE4;
    --blue-400:#5A8CF0;
    --blue-300:#9DBBF6;
    --blue-100:#E8EFFD;
    --bg:#F2F5FB;
    --surface:#FFFFFF;
    --ok:#1E9E6B;
    --ok-bg:#E4F7EF;
    --warn:#C87F0A;
    --warn-bg:#FBF0DD;
    --danger:#D6455A;
    --danger-bg:#FBE7EA;
    --text-900:#152036;
    --text-500:#657089;
    --text-300:#9AA4BA;
    --border:#E2E8F4;
    --radius:14px;
    --shadow: 0 1px 2px rgba(16,32,64,.04), 0 6px 20px rgba(16,32,64,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text-900);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:32px;
  }
  h1,h2,h3,.brand-word{font-family:'Sora',system-ui,sans-serif;}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- Header ---------- */
  header.app-header{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(120deg,var(--navy-900) 0%, var(--navy-700) 60%, var(--blue-500) 130%);
    color:#fff;
    padding:14px 16px 12px;
    box-shadow: var(--shadow);
  }
  .header-row{display:flex; align-items:center; gap:12px;}
  .kc-mark{
    width:40px; height:40px; border-radius:11px; flex:0 0 auto;
    display:block;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }
  .brand-block{line-height:1.05;}
  .brand-word{font-size:17px; font-weight:700;}
  .brand-word b{color:#9DBBF6;}
  .brand-sub{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#B7C7EE; margin-top:2px;}
  .header-date{margin-left:auto; font-size:11px; color:#C9D6F5; text-align:right;}
  .header-sync{font-size:10px; color:#DCE6FA; max-width:150px; text-align:right; line-height:1.25;}
  .quick-actions .btn-row{margin-top:4px; flex-wrap:wrap;}

  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; margin-top:14px;
    padding-bottom:2px; -ms-overflow-style:none; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    color:#DCE6FA;
    font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px;
    padding:8px 13px; border-radius:999px; cursor:pointer;
    white-space:nowrap;
    transition:.15s;
  }
  .tab-btn.active{background:#fff; color:var(--navy-800); border-color:#fff;}

  main{padding:16px; max-width:720px; margin:0 auto;}
  .section-title{font-size:19px; font-weight:700; margin:4px 0 14px;}
  .section-sub{font-size:12.5px; color:var(--text-500); margin-top:-10px; margin-bottom:16px;}

  /* ---------- Layout deux colonnes (formulaire + liste) sur grand écran ---------- */
  .content-grid{display:block;}
  .content-grid > .card:first-child{position:static;}

  /* ---------- Cards / KPIs ---------- */
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}

  /* ============================================================
     RESPONSIVE — tablette et ordinateur
     ============================================================ */
  @media (min-width: 640px){
    .kpi-grid{grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));}
    .form-grid{grid-template-columns:repeat(3, 1fr);}
    .form-grid .full{grid-column:1/-1;}
  }
  @media (min-width: 900px){
    main{max-width:1180px; padding:24px 20px;}
    header.app-header{padding:18px 24px 14px;}
    nav.tabs{flex-wrap:wrap; overflow:visible;}
    .content-grid{display:grid; grid-template-columns:360px 1fr; gap:20px; align-items:start;}
    .content-grid .card:first-child{position:sticky; top:100px;}
    .section-divider{margin-top:0;}
  }
  @media (min-width: 1280px){
    main{max-width:1320px;}
    .kpi-grid{grid-template-columns:repeat(6, 1fr);}
  }
  @media (max-width: 380px){
    .form-grid{grid-template-columns:1fr;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
  }
  .kpi-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:13px 14px; box-shadow:var(--shadow);
  }
  .kpi-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-500); font-weight:600;}
  .kpi-value{font-size:19px; font-weight:800; font-family:'Sora',sans-serif; margin-top:5px;}
  .kpi-value.good{color:var(--ok);}
  .kpi-value.bad{color:var(--danger);}
  .kpi-value.warn{color:var(--warn);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:16px;
  }
  .card h3{font-size:14px; margin:0 0 12px; display:flex; align-items:center; gap:7px;}

  /* ---------- Forms ---------- */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .form-grid .full{grid-column:1/-1;}
  label{font-size:11.5px; font-weight:600; color:var(--text-500); display:block; margin-bottom:4px;}
  input,select,textarea{
    width:100%; font-family:'Inter',sans-serif; font-size:13.5px;
    border:1.5px solid var(--border); border-radius:9px; padding:9px 10px;
    background:#FBFCFE; color:var(--text-900); outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--blue-400); background:#fff;}
  .field{margin-bottom:2px;}
  textarea{resize:vertical; min-height:44px;}

  .btn{
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; cursor:pointer;
    border-radius:10px; padding:10px 16px; border:none;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--blue-500); color:#fff;}
  .btn-primary:hover{background:var(--navy-700);}
  .btn-ghost{background:transparent; color:var(--text-500); border:1.5px solid var(--border);}
  .btn-danger-ghost{background:transparent; color:var(--danger); border:1.5px solid var(--danger-bg);}
  .btn-row{margin-top:12px; display:flex; gap:8px; justify-content:flex-end;}
  .btn-block{width:100%; justify-content:center; margin-top:12px;}

  /* ---------- List rows ---------- */
  .list{display:flex; flex-direction:column; gap:8px;}
  .row-item{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 13px; display:flex; align-items:center; gap:10px;
  }
  .row-main{flex:1; min-width:0;}
  .row-title{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-meta{font-size:11.5px; color:var(--text-500); margin-top:2px;}
  .row-amount{font-weight:800; font-size:14px; font-family:'Sora',sans-serif; white-space:nowrap;}
  .row-del{background:none; border:none; color:var(--text-300); font-size:16px; cursor:pointer; padding:4px 6px;}
  .row-del:hover{color:var(--danger);}
  .row-edit{background:none; border:none; color:var(--text-300); font-size:15px; cursor:pointer; padding:4px 6px;}
  .row-edit:hover{color:var(--blue-500);}

  .search-box{position:relative; margin-bottom:12px;}
  .search-box input{padding-left:34px;}
  .search-box::before{content:"🔍"; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:13px; opacity:.5;}
  .editing-banner{
    background:var(--blue-100); color:var(--navy-700); font-size:11.5px; font-weight:600;
    padding:7px 12px; border-radius:9px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
  }
  .editing-banner a{color:var(--navy-700); text-decoration:underline; cursor:pointer;}

  .pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .pill-ok{background:var(--ok-bg); color:var(--ok);}
  .pill-warn{background:var(--warn-bg); color:var(--warn);}
  .pill-danger{background:var(--danger-bg); color:var(--danger);}
  .pill-neutral{background:var(--blue-100); color:var(--blue-500);}

  .empty{
    text-align:center; padding:34px 16px; color:var(--text-500); font-size:13px;
    border:1.5px dashed var(--border); border-radius:var(--radius);
  }

  .section-divider{
    display:flex; align-items:center; gap:8px; margin:22px 0 10px;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-500);
  }
  .section-divider::after{content:""; flex:1; height:1px; background:var(--border);}

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--navy-900); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:12.5px; font-weight:600; box-shadow:var(--shadow); z-index:100;
    opacity:0; pointer-events:none; transition:.25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  /* ---------- Boîtes de dialogue personnalisées (remplacent confirm()/prompt()) ---------- */
  .dialog-overlay{
    position:fixed; inset:0; background:rgba(15,34,66,.45); backdrop-filter:blur(1px);
    display:flex; align-items:center; justify-content:center; padding:18px;
    z-index:300; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .dialog-overlay.show{opacity:1; pointer-events:auto;}
  .dialog-box{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:20px; width:100%; max-width:340px;
    transform:translateY(10px) scale(.97); transition:transform .18s;
  }
  .dialog-overlay.show .dialog-box{transform:translateY(0) scale(1);}
  .dialog-title{font-family:'Sora',sans-serif; font-weight:800; font-size:15px; color:var(--text-900); margin-bottom:6px;}
  .dialog-msg{font-size:13px; color:var(--text-500); line-height:1.5; margin:0;}
  .dialog-input{width:100%; margin-top:12px;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-danger:hover{background:#B23A4C;}

  .invoice-view{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-top:10px;}
  .invoice-view table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}
  .invoice-view th,.invoice-view td{padding:7px 4px; border-bottom:1px solid var(--border); text-align:left;}
  .invoice-view th:last-child, .invoice-view td:last-child{text-align:right;}

  .splash-screen{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:radial-gradient(circle at 18% 10%,rgba(90,140,240,.38),transparent 35%),linear-gradient(135deg,var(--navy-900),var(--navy-700) 58%,var(--blue-500));color:#fff;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease;}
  .splash-screen.is-hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .splash-content{text-align:center;padding:28px;animation:splash-enter .55s ease both;}
  .splash-logo{width:88px;height:88px;border-radius:24px;box-shadow:0 14px 34px rgba(0,0,0,.28);margin-bottom:24px;}
  .splash-kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#C9D6F5;margin-bottom:12px;}
  .splash-content h1{font-size:clamp(25px,7vw,42px);line-height:1.15;margin:0 0 12px;font-weight:800;}
  .splash-content h1 b{color:#BFD2FF;}
  .splash-subtitle{font-size:14px;color:#DCE6FA;letter-spacing:.04em;}
  @keyframes splash-enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .splash-content{animation:none;} .splash-screen{transition:none;} }
  .helper{font-size:11px; color:var(--text-500); margin-top:6px; line-height:1.5;}
  .lignes-row{display:grid; grid-template-columns:2fr 1fr; gap:8px; align-items:end; margin-bottom:8px;}
  ::selection{background:var(--blue-300);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>

<script>
/* ============================================================
   FIREBASE — connexion à votre base de données
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAXs3JCqstM6Xt0n4ZoSuz6A_y81l1z5OE",
  authDomain: "klab-center.firebaseapp.com",
  projectId: "klab-center",
  storageBucket: "klab-center.firebasestorage.app",
  messagingSenderId: "163203098090",
  appId: "1:163203098090:web:3d0aa83e925ce1bc5b7e93"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){ console.warn('Persistence Firestore indisponible', e); }
try{ auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
let currentUser = null;
let dataOwnerUid = null;   // uid dont dépendent les données affichées (soi-même, ou son employeur)
let unsubscribeSync = null;

// App Firebase secondaire : permet de créer un compte employé sans déconnecter le propriétaire.
let secondaryAppInstance = null;
function secondaryAuth(){
  if(!secondaryAppInstance){
    secondaryAppInstance = firebase.apps.find(a=>a.name==='Secondary')
      || firebase.initializeApp(firebaseConfig, 'Secondary');
  }
  return secondaryAppInstance.auth();
}

let onlineState = navigator.onLine;
let syncState = 'synced'; // synced | pending | failed
window.addEventListener('online', ()=>{ onlineState=true; updateConnectionBadge(); showToast('🟢 Connexion rétablie — synchronisation Firebase'); });
window.addEventListener('offline', ()=>{ onlineState=false; updateConnectionBadge(); showToast('🟠 Hors connexion — les données restent disponibles'); });
function updateConnectionBadge(){ const el=document.getElementById('connectionBadge'); if(el){ const label=onlineState?(syncState==='failed'?'🔴 Échec de synchronisation':syncState==='pending'?'🟡 Synchronisation…':'🟢 En ligne · Synchronisé'):'🟠 Hors connexion · Données locales'; el.textContent=label; el.title=syncState==='failed'?'La dernière écriture n’a pas été confirmée par Firebase':onlineState?'Firebase disponible':'Les modifications seront à confirmer à la reconnexion'; } }
</script>

<script>
/* ============================================================
   ÉTAT & PERSISTANCE
   ============================================================ */
const KEYS = {
  clients:'kc_clients', produits:'kc_produits', ventes:'kc_ventes',
  depenses:'kc_depenses', factures:'kc_factures', fournisseurs:'kc_fournisseurs', commandes:'kc_commandes', mouvementsStock:'kc_mouvements_stock', parametres:'kc_parametres',
  tresorerie:'kc_tresorerie'
};

let state = {
  clients: [], produits: [], ventes: [], depenses: [], factures: [], fournisseurs: [], commandes: [], mouvementsStock: [],
  parametres: { nom:'KlabCenter', telephone:'', adresse:'Kankalabé Centre, en face de la Mosquée du Centre', email:'klabcentergn@gmail.com', devise:'GNF', nif:'' },
  tresorerie: { soldeDepart: 0 },
  activeTab: 'accueil',
  role: 'proprietaire', // 'proprietaire' | 'tresorier' | 'secretaire'
  employes: [],
  employesLoading: false,
  employesLoaded: false,
  journal: [],
  journalLoading: false,
  journalLoaded: false,
  loading: true,
  editing: { clients:null, produits:null, ventes:null, depenses:null, commandes:null },
  search: { clients:'', produits:'', ventes:'', depenses:'', commandes:'' }
};

const MODES_PAIEMENT = ['Espèces','Orange Money','MTN Mobile Money','Virement','Crédit'];
const CATEGORIES_DEPENSES = ['Achat marchandises','Loyer','Salaires','Transport','Communication','Électricité/Eau','Marketing/Publicité','Entretien/Réparation','Impôts/Taxes','Fournitures bureau','Autres'];
const CATEGORIES_BIENS = ['Papeterie','Librairie','Fournitures bureau','Fournitures scolaires','Électroniques','Consommables imprimantes','Bureautique','Autres biens'];
const CATEGORIES_SERVICES = ['Documents & CV','Photographie','Maintenance','Formation','Installation','Assistance informatique','Impression','Autres services'];
const CATEGORIES_PRODUITS = [...new Set([...CATEGORIES_BIENS,...CATEGORIES_SERVICES])];
function categoriesPourType(type){ return type === 'Service' ? CATEGORIES_SERVICES : CATEGORIES_BIENS; }
const UNITES_STOCK = ['Unité','Article','Enveloppe','Cahier','Paquet','Boîte','Rame','Bouteille'];
const UNITES_ACHAT = ['Unité','Paquet','Carton','Boîte','Lot','Sac','Rouleau','Bouteille'];
const UNITES_CONDITIONNEMENT = [...new Set([...UNITES_STOCK,...UNITES_ACHAT])];

function uid(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fmtGNF(n){ n = Number(n)||0; return n.toLocaleString('fr-FR',{maximumFractionDigits:0}) + ' GNF'; }
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;} }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* Stockage : Firestore (source de vérité, synchronisée entre appareils),
   avec repli sur localStorage si hors-ligne ou navigateur limité.
   dataOwnerUid = l'espace de données consulté (soi-même, ou celui de son employeur). */
function userKey(k){ return 'kc_' + dataOwnerUid + '_' + k; }

async function storageGet(key){
  try{
    const doc = await db.collection('users').doc(dataOwnerUid).collection('data').doc(key).get();
    if(doc.exists && doc.data().json) return JSON.parse(doc.data().json);
  }catch(e){ console.warn('Firestore indisponible, repli local', e); }
  try{ const raw=localStorage.getItem(userKey(key)); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
async function ensureUserProfile(){
  if(!currentUser) return;
  try{
    await db.collection('users').doc(currentUser.uid).set({
      email: currentUser.email || '',
      lastSeenAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  }catch(e){ console.warn('Profil Firebase non synchronisé', e); }
}
function startRealtimeSync(){
  if(!currentUser) return;
  if(unsubscribeSync) unsubscribeSync();
  unsubscribeSync = db.collection('users').doc(dataOwnerUid).collection('data').onSnapshot(snapshot=>{
    let changed=false;
    snapshot.forEach(doc=>{
      const key=Object.keys(KEYS).find(k=>KEYS[k]===doc.id);
      if(!key || !doc.data().json) return;
      try{ const incoming=JSON.parse(doc.data().json); state[key]=incoming; localStorage.setItem(userKey(KEYS[key]), JSON.stringify(incoming)); changed=true; }catch(e){}
    });
    if(changed && !state.loading) render();
  }, err=>console.warn('Synchronisation temps réel indisponible', err));
}
async function storageSet(key, value){
  syncState='pending'; updateConnectionBadge();
  let ok = false;
  try{
    await db.collection('users').doc(dataOwnerUid).collection('data').doc(key)
      .set({ json: JSON.stringify(value), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    ok = true; syncState='synced';
  }catch(e){ console.warn('Écriture Firestore non confirmée', e); syncState='failed'; }
  try{ localStorage.setItem(userKey(key), JSON.stringify(value)); }catch(e){}
  updateConnectionBadge();
  return ok;
}

function estProprietaire(){ return state.role === 'proprietaire'; }

// Détermine si le compte connecté est le propriétaire ou un employé rattaché,
// et fixe dataOwnerUid + state.role en conséquence avant tout chargement de données.
// Retourne false si le compte employé a été suspendu (l'appelant doit alors interrompre la connexion).
async function resolveAccessContext(){
  dataOwnerUid = currentUser.uid;
  state.role = 'proprietaire';
  state.employeNom = '';
  try{
    const lien = await db.collection('liens_employes').doc(currentUser.uid).get();
    if(lien.exists){
      const d = lien.data();
      if(d.suspendu === true){
        await auth.signOut();
        return false;
      }
      dataOwnerUid = d.ownerUid;
      state.role = d.role === 'tresorier' ? 'tresorier' : (d.role === 'secretaire' ? 'secretaire' : 'proprietaire');
      state.employeNom = d.nom || currentUser.email || '';
    }
  }catch(e){ console.warn('Résolution du profil employé impossible, accès propriétaire par défaut', e); }
  state.activeTab = state.role==='tresorier' ? 'tresorerie' : state.role==='secretaire' ? 'clients' : 'accueil';
  state.employesLoaded = false;
  state.journalLoaded = false;
  return true;
}

async function loadAll(){
  try{
    for(const [k,key] of Object.entries(KEYS)){
      const val = await storageGet(key);
      if(val!==null) state[k] = val;
    }
  }catch(e){ console.error('Erreur de chargement', e); }
  state.loading = false;
  render();
  updateConnectionBadge();
  ensureUserProfile();
  startRealtimeSync();
}

const LABELS_DONNEES = {
  clients:'Clients', produits:'Produits', ventes:'Ventes',
  depenses:'Dépenses', factures:'Factures', fournisseurs:'Fournisseurs', commandes:'Commandes', mouvementsStock:'Mouvements de stock', parametres:'Paramètres', tresorerie:'Trésorerie'
};

// Journalise une action employé (ajout/modification) pour traçabilité — jamais pour le propriétaire.
async function journaliserAction(key, action){
  if(estProprietaire()) return;
  try{
    await db.collection('journal_employes').add({
      ownerUid: dataOwnerUid,
      employeUid: currentUser.uid,
      employeNom: state.employeNom || currentUser.email || '',
      role: state.role,
      typeDonnee: KEYS[key],
      libelleDonnee: LABELS_DONNEES[key] || key,
      action, // 'creation' | 'modification'
      horodatage: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ console.warn('Journalisation impossible', e); }
}

// Le 2e paramètre (optionnel) déclenche une entrée de journal si l'auteur est un employé :
// persist('clients', 'creation') ou persist('clients', 'modification').
async function persist(key, action){
  const ok = await storageSet(KEYS[key], state[key]);
  if(!ok) showToast("⚠️ Donnée conservée localement, mais non confirmée par Firebase. Reconnectez-vous avant de fermer.");
  if(action) journaliserAction(key, action);
}

auth.onAuthStateChanged(async user=>{

/* ============================================================
   BOÎTES DE DIALOGUE PERSONNALISÉES (remplacent confirm()/prompt())
   ============================================================ */
function customConfirm(message, opts={}){
  const { title='Confirmation', okText='Confirmer', cancelText='Annuler', danger=false } = opts;
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="dialog-box" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
        <div class="dialog-title" id="dlgTitle">${title}</div>
        <p class="dialog-msg">${message}</p>
        <div class="btn-row">
          <button type="button" class="btn btn-ghost" data-act="cancel">${cancelText}</button>
          <button type="button" class="btn ${danger?'btn-danger':'btn-primary'}" data-act="ok">${okText}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close = result=>{
      overlay.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(()=>overlay.remove(), 180);
      resolve(result);
    };
    const onKey = e=>{
      if(e.key==='Escape') close(false);
      if(e.key==='Enter') close(true);
    };
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) close(false); });
    overlay.querySelector('[data-act="cancel"]').addEventListener('click', ()=>close(false));
    overlay.querySelector('[data-act="ok"]').addEventListener('click', ()=>close(true));
    requestAnimationFrame(()=>{ overlay.classList.add('show'); overlay.querySelector('[data-act="ok"]').focus(); });
  });
}

function customPrompt(message, opts={}){
  const { title='', defaultValue='', placeholder='', okText='Valider', cancelText='Annuler', type='text' } = opts;
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
        ${title?`<div class="dialog-title" id="dlgTitle">${title}</div>`:''}
        <p class="dialog-msg">${message}</p>
        <input type="${type}" class="dialog-input" value="${defaultValue}" placeholder="${placeholder}">
        <div class="btn-row">
          <button type="button" class="btn btn-ghost" data-act="cancel">${cancelText}</button>
          <button type="button" class="btn btn-primary" data-act="ok">${okText}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('.dialog-input');
    const close = result=>{
      overlay.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(()=>overlay.remove(), 180);
      resolve(result);
    };
    const onKey = e=>{
      if(e.key==='Escape') close(null);
      if(e.key==='Enter'){ e.preventDefault(); close(input.value.trim()||null); }
    };
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) close(null); });
    overlay.querySelector('[data-act="cancel"]').addEventListener('click', ()=>close(null));
    overlay.querySelector('[data-act="ok"]').addEventListener('click', ()=>close(input.value.trim()||null));
    requestAnimationFrame(()=>{ overlay.classList.add('show'); input.focus(); });
  });
}

/* ============================================================
   CALCULS MÉTIER
   ============================================================ */
function produitById(id){ return state.produits.find(p=>p.id===id); }
function clientById(id){ return state.clients.find(c=>c.id===id); }

function sortiesFor(produitId){
  return state.ventes.filter(v=>v.produitId===produitId).reduce((s,v)=>s+Number(v.quantite||0),0);
}
function uniteStock(p){ return p?.uniteStock || 'Unité'; }
function uniteAchat(p){ return p?.uniteAchat || 'Unité'; }
function facteurAchat(p){ return Math.max(1, Number(p?.facteurAchat)||1); }
function conditionnementConnu(p){ return p?.type==='Bien' && Number(p?.facteurAchat)>0 && p?.conditionnementConfirme!==false; }
function libelleAchat(p){ const achat=uniteAchat(p); return conditionnementConnu(p) ? `1 ${achat} = ${facteurAchat(p)} ${uniteStock(p)}` : `1 ${achat} = contenu à confirmer`; }
function libelleConditionnement(p){ const achat=uniteAchat(p); const stock=uniteStock(p); const facteur=facteurAchat(p); return facteur>1 ? `${achat} · 1 ${achat} = ${facteur} ${stock}${facteur>1?'s':''}` : achat; }
function libelleStock(p,quantite){ const q=Number(quantite); const u=uniteStock(p); return `${q} ${u}${q===1?'':'s'}`; }
function stockActuel(p){
  if(!p || p.type==='Service') return null;
  const ventes = sortiesFor(p.id);
  return Math.max(0, Number(p.stockInitial||0) + Number(p.entrees||0) - ventes + Number(p.ajustements||0));
}
function statutStock(p){
  if(p.type==='Service') return 'Service';
  const sa = stockActuel(p);
  const seuil = Number(p.seuilAlerte)||5;
  if(sa<=0) return 'RUPTURE';
  if(sa<seuil) return 'FAIBLE';
  return 'OK';
}
function ventesTotal(v){ return Number(v.quantite||0) * Number(v.prixUnitaire||0); }
function reglementsVente(v){
  if(Array.isArray(v.reglements)) return v.reglements;
  // Les anciennes ventes immédiates sont considérées encaissées à leur date.
  // Les anciennes ventes à crédit marquées « Oui » restent à rapprocher :
  // aucune entrée de trésorerie n’est inventée sans preuve de règlement.
  if(v.modePaiement!=='Crédit' && v.paye!=='Non') return [{id:'legacy-'+v.id, date:v.date||todayISO(), montant:ventesTotal(v), modePaiement:v.modePaiement}];
  return [];
}
function montantRegle(v){ return reglementsVente(v).reduce((s,r)=>s+Number(r.montant||0),0); }
function resteVente(v){ return Math.max(0, ventesTotal(v)-montantRegle(v)); }
function estCredit(v){ return v.modePaiement==='Crédit' || resteVente(v)>0; }

function totalAchatsClient(clientId){
  return state.ventes.filter(v=>v.clientId===clientId).reduce((s,v)=>s+ventesTotal(v),0);
}

function caTotal(){ return state.ventes.reduce((s,v)=>s+ventesTotal(v),0); }
function depensesTotal(){ return state.depenses.filter(d=>d.annulee!==true).reduce((s,d)=>s+Number(d.montant||0),0); }
function beneficeEstime(){ return caTotal() - depensesTotal(); }
function valeurStock(){
  return state.produits.filter(p=>p.type!=='Service').reduce((s,p)=>{
    const sa = stockActuel(p); return s + (sa>0? sa*Number(p.prix||0) : 0);
  },0);
}
function stockAAlerter(){
  return state.produits.filter(p=>['RUPTURE','FAIBLE'].includes(statutStock(p))).length;
}
function tresorerieParMode(mode){
  const entrees = state.ventes.reduce((s,v)=>s + reglementsVente(v).filter(r=>r.modePaiement===mode).reduce((x,r)=>x+Number(r.montant||0),0),0);
  const sorties = state.depenses.filter(d=>d.annulee!==true && d.modePaiement===mode).reduce((s,d)=>s+Number(d.montant||0),0);
  return {entrees, sorties, solde: entrees-sorties};
}
function creditsRegles(){
  return state.ventes.filter(v=>v.modePaiement==='Crédit').reduce((s,v)=>s+montantRegle(v),0);
}
function creancesEnCours(){
  return state.ventes.reduce((s,v)=>s+resteVente(v),0);
}
function ventesCreditEnCours(){
  return state.ventes.filter(v=>v.modePaiement==='Crédit' && resteVente(v)>0);
}
function tresorerieDisponible(){
  let total = Number(state.tresorerie.soldeDepart||0);
  ['Espèces','Orange Money','MTN Mobile Money','Virement'].forEach(m=>{
    total += tresorerieParMode(m).solde;
  });
  return total;
}

function monthlyData(months){
  const now = new Date();
  const buckets = [];
  for(let i=months-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    buckets.push({ key: d.toISOString().slice(0,7), label: d.toLocaleDateString('fr-FR',{month:'short'}), ca:0, dep:0 });
  }
  const idx = {}; buckets.forEach((b,i)=>idx[b.key]=i);
  state.ventes.forEach(v=>{ const k=(v.date||'').slice(0,7); if(k in idx) buckets[idx[k]].ca += ventesTotal(v); });
  state.depenses.filter(d=>d.annulee!==true).forEach(d=>{ const k=(d.date||'').slice(0,7); if(k in idx) buckets[idx[k]].dep += Number(d.montant||0); });
  return buckets;
}
let accueilChart = null;
function attachAccueilHandlers(){

  const canvas = document.getElementById('chartCA');
  if(!canvas || typeof Chart==='undefined') return;
  const data = monthlyData(6);
  if(accueilChart){ accueilChart.destroy(); accueilChart=null; }
  accueilChart = new Chart(canvas, {
    type:'bar',
    data:{
      labels: data.map(d=>d.label),
      datasets:[
        { label:"Chiffre d'affaires", data:data.map(d=>d.ca), backgroundColor:'#2F6FE4', borderRadius:5, maxBarThickness:26 },
        { label:'Dépenses', data:data.map(d=>d.dep), backgroundColor:'#D6455A', borderRadius:5, maxBarThickness:26 }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11}, usePointStyle:true } } },
      scales:{ y:{ ticks:{ callback:v=>Number(v).toLocaleString('fr-FR'), font:{size:10} } }, x:{ ticks:{ font:{size:11} } } }
    }
  });
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  document.getElementById('cancelEditClient')?.addEventListener('click', ()=>{ state.editing.clients=null; render(); });

  });
  document.querySelectorAll('[data-del-client]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!estProprietaire()) return;
      if(!await customConfirm('Supprimer ce client ?', {title:'Suppression', okText:'Supprimer', danger:true})) return;
      state.clients = state.clients.filter(c=>c.id!==b.dataset.delClient);
      if(state.editing.clients===b.dataset.delClient) state.editing.clients=null;
      await persist('clients');
      render();
    });
  });
  const search = document.getElementById('searchClients');
  search?.addEventListener('input', ()=>{
    state.search.clients = search.value;
    const q = search.value.toLowerCase();
    const list = [...state.clients]
      .filter(c => !q || (c.nom||'').toLowerCase().includes(q) || (c.telephone||'').includes(q))
      .sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
    document.getElementById('clientsListWrap').innerHTML = renderClientsList(list);

        state.clients = state.clients.filter(c=>c.id!==b.dataset.delClient);
        await persist('clients');
        render();
      });
    });
  });
}

function renderProduitsList(list){

    ${list.map(p=>{
      const statut = statutStock(p);

      const stockTxt = p.type==='Service' ? 'Service' : `Stock : ${libelleStock(p,stockActuel(p))}`;

        <div class="row-main">
          <div class="row-title">${esc(p.nom)}</div>
          <div class="row-meta">${esc(p.categorie||'—')} · ${stockTxt}${p.type==='Bien'?` · Stock suivi en ${esc(uniteStock(p))} · Achat : ${esc(libelleConditionnement(p))}`:''} · ${p.prix?fmtGNF(p.prix):'Prix non défini'}</div>
        </div>
        <span class="pill ${p.actif===false?'pill-neutral':pillClass}">${p.actif===false?'Archivé':statut}</span>

        ${estProprietaire() ? `<button class="row-del" data-archive-produit="${p.id}" title="${p.actif===false?'Réactiver':'Archiver'}">${p.actif===false?'↻':'⏸'}</button>` : ''}

    }).join('')}
  </div>`;
}
function attachProduitsHandlers(){
  const f = document.getElementById('formProduit');
  const typeSelect = f?.querySelector('[name="type"]');
  const stockFields = f ? [...f.querySelectorAll('.stock-field')] : [];
  const stockInputs = f ? [...f.querySelectorAll('[name="seuilAlerte"],[name="stockInitial"],[name="entrees"],[name="facteurAchat"]')] : [];
  const conditionnementInputs = f ? [...f.querySelectorAll('[name="uniteStock"],[name="uniteAchat"]')] : [];
  const stockHelper = document.getElementById('stockHelper');
  function syncStockFields(){
    const isBien = typeSelect?.value === 'Bien';
    stockFields.forEach(el=>{ el.style.display = isBien ? '' : 'none'; });
    stockInputs.forEach(input=>{ input.disabled = !isBien; if(!isBien) input.value = '0'; });
    conditionnementInputs.forEach(input=>{ input.disabled = !isBien; if(!isBien) input.value = 'Unité'; });
    if(stockHelper){ const stock=f?.querySelector('[name="uniteStock"]')?.value||'Unité'; const achat=f?.querySelector('[name="uniteAchat"]')?.value||'Unité'; const raw=f?.querySelector('[name="facteurAchat"]')?.value; const facteur=Number(raw); stockHelper.textContent = isBien ? (facteur>0 ? `Résumé : vous vendez des ${stock}s. 1 ${achat} acheté = ${facteur} ${stock}${facteur>1?'s':''} en stock.` : `Résumé : vous vendez des ${stock}s. Le contenu d’un ${achat} sera renseigné à la réception.`) : 'Résumé : un service ne demande pas de stock.'; }
  }
  typeSelect?.addEventListener('change', ()=>{
    syncStockFields();
    const cat=f?.querySelector('[name="categorie"]');
    if(cat){ const cats=categoriesPourType(typeSelect.value); cat.innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join(''); cat.value=cats[0]||''; }
  });
  f?.querySelector('[name="uniteStock"]')?.addEventListener('change', syncStockFields);
  f?.querySelector('[name="uniteAchat"]')?.addEventListener('change', syncStockFields);
  f?.querySelector('[name="facteurAchat"]')?.addEventListener('input', syncStockFields);
  syncStockFields();
  setTimeout(()=>f?.querySelector('[name="nom"]')?.focus(),60);

  f?.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(f);
    const nom = fd.get('nom').trim();
    if(!nom) return;
    const editId = state.editing.produits;
    const type = fd.get('type');
    const estBien = type === 'Bien';
    const vals = {
      nom, categorie: fd.get('categorie'), type,
      prix: Number(fd.get('prix'))||0,
      seuilAlerte: estBien ? (Number(fd.get('seuilAlerte'))||5) : 0,
      stockInitial: estBien ? (Number(fd.get('stockInitial'))||0) : 0,
      entrees: estBien ? (Number(fd.get('entrees'))||0) : 0,
      uniteStock: estBien ? (fd.get('uniteStock')||'Unité') : 'Unité',
      uniteAchat: estBien ? (fd.get('uniteAchat')||'Unité') : 'Unité',
      facteurAchat: estBien && Number(fd.get('facteurAchat'))>0 ? Number(fd.get('facteurAchat')) : null,
      conditionnementConfirme: estBien && Number(fd.get('facteurAchat'))>0
    };
    if(editId){
      const p = state.produits.find(x=>x.id===editId);
      Object.assign(p, vals);
      state.editing.produits = null;
      showToast('Article modifié');
    }else{
      state.produits.push({ id: uid('prod'), ajustements:0, actif:true, ...vals });
      showToast('Article ajouté au catalogue');
    }
    await persist('produits', editId ? 'modification' : 'creation');
    render();
    if(!editId) setTimeout(()=>document.querySelector('#formProduit [name="nom"]')?.focus(),150);
  });
  document.getElementById('cancelEditProduit')?.addEventListener('click', ()=>{ state.editing.produits=null; render(); });
  document.querySelectorAll('[data-edit-produit]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.editing.produits = b.dataset.editProduit; render(); });
  });
  document.querySelectorAll('[data-archive-produit]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!estProprietaire()) return;
      const p=state.produits.find(x=>x.id===b.dataset.archiveProduit); if(!p)return;
      const activer=p.actif===false;
      if(!await customConfirm(activer?'Réactiver cet article ?':'Archiver cet article ? Il restera visible dans l’historique.', {title:activer?'Réactivation':'Archivage', okText:activer?'Réactiver':'Archiver'})) return;
      p.actif=activer;
      await persist('produits','modification');
      render();
    });
  });
  const search = document.getElementById('searchProduits');
  search?.addEventListener('input', ()=>{
    state.search.produits = search.value;
    const q = search.value.toLowerCase();
    const list = [...state.produits]
      .filter(p => !q || (p.nom||'').toLowerCase().includes(q) || (p.categorie||'').toLowerCase().includes(q))
      .sort((a,b)=>(a.categorie||'').localeCompare(b.categorie||'') || (a.nom||'').localeCompare(b.nom||''));
    document.getElementById('produitsListWrap').innerHTML = renderProduitsList(list);
    document.querySelectorAll('[data-edit-produit]').forEach(b=>{
      b.addEventListener('click', ()=>{ state.editing.produits = b.dataset.editProduit; render(); });
    });
    document.querySelectorAll('[data-archive-produit]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!estProprietaire()) return;
        const p=state.produits.find(x=>x.id===b.dataset.archiveProduit); if(!p)return;
        p.actif=p.actif===false;
        await persist('produits','modification');
        render();
      });
    });
  });
}

        ${estProprietaire() ? `<button class="row-del" data-del-vente="${v.id}" title="Supprimer">✕</button>` : ''}

function attachVentesHandlers(){
  const selProduit = document.getElementById('venteProduit');
  const inputPrix = document.getElementById('ventePrix');
  const selMode = document.getElementById('venteMode');
  selProduit?.addEventListener('change', ()=>{
    const opt = selProduit.selectedOptions[0];
    const prix = opt?.dataset?.prix;
    if(prix!==undefined) inputPrix.value = prix;
    const p=produitById(selProduit.value); const helper=document.getElementById('venteStockHelper'); if(helper) helper.textContent=p?.type==='Bien'?`Stock disponible : ${libelleStock(p,stockActuel(p))}. Achat habituel : ${libelleConditionnement(p)}.`:'Les services ne sont pas stockés.';
  });
  const f = document.getElementById('formVente');
  f?.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(f);
    const produitId = fd.get('produitId');
    if(!produitId) return;
    const editId = state.editing.ventes;
    const modePaiement = fd.get('modePaiement');
    const existing = editId ? state.ventes.find(x=>x.id===editId) : null;
    if(editId && existing && montantRegle(existing)>0){ showToast('Cette vente est protégée car un règlement existe déjà.'); return; }
    const quantiteDemandee = Math.max(1, Math.floor(Number(fd.get('quantite'))||1));
    const total = quantiteDemandee * (Number(fd.get('prixUnitaire'))||0);
    const produitDemande = produitById(produitId);
    if(produitDemande?.type==='Bien'){
      let disponible = Number(stockActuel(produitDemande)||0);
      // Lors de la modification d’une vente non réglée, on neutralise sa propre quantité déjà sortie.
      if(editId && existing?.produitId===produitId) disponible += Number(existing.quantite||0);
      if(quantiteDemandee > disponible){
        showToast(`Stock insuffisant : ${produitDemande.nom} — disponible ${disponible}, demandé ${quantiteDemandee}`);
        return;
      }
    }
    let reglements = Array.isArray(existing?.reglements) ? existing.reglements : [];
    if(modePaiement!=='Crédit' && reglements.length===0){
      reglements = [{id:uid('reg'), date:fd.get('date')||todayISO(), montant:total, modePaiement}];
    }
    const vals = {
      date: fd.get('date')||todayISO(), clientId: fd.get('clientId')||null,
      produitId, quantite: quantiteDemandee, prixUnitaire: Number(fd.get('prixUnitaire'))||0,
      modePaiement, paye: modePaiement!=='Crédit' ? 'Oui' : (reglements.reduce((s,r)=>s+Number(r.montant||0),0)>=total?'Oui':'Non'), reglements,
      observations: fd.get('observations').trim()
    };
    if(editId){
      Object.assign(existing, vals);
      state.editing.ventes = null;
      showToast('Vente modifiée');
    }else{
      const newVente={ id: uid('vte'), ...vals };
      state.ventes.push(newVente);
      const produitVendu=produitById(produitId);
      if(produitVendu?.type==='Bien') enregistrerMouvementStock({produitId,quantite:-Number(vals.quantite||0),type:'Vente',reference:newVente.id});
      showToast('Vente enregistrée');
    }
    await persist('ventes', editId ? 'modification' : 'creation');
    if(!editId) await persist('mouvementsStock','creation');
    render();
  });
  document.getElementById('cancelEditVente')?.addEventListener('click', ()=>{ state.editing.ventes=null; render(); });
  document.querySelectorAll('[data-edit-vente]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.editing.ventes = b.dataset.editVente; render(); });
  });
  document.querySelectorAll('[data-del-vente]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!estProprietaire()) return;
      if(!await customConfirm('Supprimer cette vente ?', {title:'Suppression', okText:'Supprimer', danger:true})) return;
      state.ventes = state.ventes.filter(v=>v.id!==b.dataset.delVente);
      if(state.editing.ventes===b.dataset.delVente) state.editing.ventes=null;
      await persist('ventes');
      render();
    });
  });
  const search = document.getElementById('searchVentes');
  search?.addEventListener('input', ()=>{
    state.search.ventes = search.value;
    const q = search.value.toLowerCase();
    const list = [...state.ventes]
      .filter(v=>{
        if(!q) return true;
        const p = produitById(v.produitId); const c = clientById(v.clientId);
        return (p?.nom||'').toLowerCase().includes(q) || (c?.nom||'').toLowerCase().includes(q) || (v.modePaiement||'').toLowerCase().includes(q);
      })
      .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    document.getElementById('ventesListWrap').innerHTML = renderVentesList(list);
    document.querySelectorAll('[data-edit-vente]').forEach(b=>{
      b.addEventListener('click', ()=>{ state.editing.ventes = b.dataset.editVente; render(); });
    });
    document.querySelectorAll('[data-del-vente]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!estProprietaire()) return;
        if(!await customConfirm('Supprimer cette vente ?', {title:'Suppression', okText:'Supprimer', danger:true})) return;
        state.ventes = state.ventes.filter(v=>v.id!==b.dataset.delVente);
        await persist('ventes');
        render();
      });
    });
  });
}

let logoDataUrlCache=null;
async function logoDataUrl(){
  if(logoDataUrlCache) return logoDataUrlCache;
  try{ const res=await fetch('./logo-klabcenter.png'); const blob=await res.blob(); logoDataUrlCache=await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(blob); }); return logoDataUrlCache; }catch(e){ console.warn('Logo indisponible pour le PDF',e); return null; }
}
async function telechargerFacturePdf(f, c, total){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:'a4' });
    const marginX = 18; let y = 22;
    const logo=await logoDataUrl();
    if(logo){ doc.addImage(logo,'PNG',marginX,10,30,30); }
    const headerX=logo?54:marginX;

    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(state.parametres.nom||'KlabCenter', headerX, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
    (state.parametres.adresse||'').split('\n').forEach(line=>{ doc.text(line, headerX, y); y += 5; });
    if(state.parametres.telephone || state.parametres.email){
      doc.text(`${state.parametres.telephone||''}  ${state.parametres.email||''}`.trim(), headerX, y); y += 5;
    }

    doc.setTextColor(20); doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(f.numero, 190, 22, { align:'right' });
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
    doc.text(fmtDate(f.date), 190, 29, { align:'right' });

    y += 6;
    doc.setDrawColor(220); doc.line(marginX, y, 192, y); y += 8;

    doc.setTextColor(20); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Client', marginX, y); y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text(c ? c.nom : 'Client de passage', marginX, y); y += 5;
    if(c?.telephone){ doc.text(c.telephone, marginX, y); y += 5; }

    y += 6;
    doc.setFillColor(19,44,84);
    doc.rect(marginX, y, 174, 8, 'F');
    doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Article', marginX+3, y+5.5);
    doc.text('Qté', 145, y+5.5);
    doc.text('Total', 190, y+5.5, { align:'right' });
    y += 8;

    doc.setTextColor(30); doc.setFont('helvetica','normal');
    f.lignes.forEach((l,i)=>{
      const rowH = 8;
      if(i%2===1){ doc.setFillColor(246,248,252); doc.rect(marginX, y, 174, rowH, 'F'); }
      doc.text(String(l.nom).slice(0,45), marginX+3, y+5.5);
      doc.text(String(l.quantite), 145, y+5.5);
      doc.text(fmtGNF(l.quantite*l.prixUnitaire), 190, y+5.5, { align:'right' });
      y += rowH;
    });

    y += 6;
    doc.setDrawColor(220); doc.line(120, y, 192, y); y += 8;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20);
    doc.text('Total', 145, y);
    doc.text(fmtGNF(total), 190, y, { align:'right' });

    doc.save(`${f.numero}.pdf`);
  }catch(e){
    console.error(e);
    showToast("Impossible de générer le PDF sur cet appareil.");
  }
}

function fournisseurById(id){ return state.fournisseurs.find(f=>f.id===id); }
function commandeTotal(c){ return (c.lignes||[]).reduce((s,l)=>s+Number(l.quantite||0)*Number(l.prixUnitaire||0),0); }
function commandeReste(c){ return (c.lignes||[]).reduce((s,l)=>s+Math.max(0,Number(l.quantite||0)-Number(l.quantiteRecue||0)),0); }
function statutCommande(c){
  if(c.statut==='Annulée') return 'Annulée';
  if(commandeReste(c)<=0 && (c.lignes||[]).length) return 'Réceptionnée';
  if((c.lignes||[]).some(l=>Number(l.quantiteRecue||0)>0)) return 'Réception partielle';
  return c.statut||'Brouillon';
}

function imprimerCommande(id){
  const c=state.commandes.find(x=>x.id===id); if(!c)return; const f=fournisseurById(c.fournisseurId); const w=window.open('','_blank'); if(!w){showToast('Autorisez les fenêtres pop-up pour imprimer');return;} const logoUrl=new URL('logo-klabcenter.png',location.href).href;

print(),250);}
async function receptionnerCommande(id){
  const c=state.commandes.find(x=>x.id===id); if(!c)return;
  for(const l of c.lignes){ const p=produitById(l.produitId); const reste=Math.max(0,Number(l.quantite||0)-Number(l.quantiteRecue||0)); if(!p||reste<=0)continue;
    const achat=l.uniteAchat||uniteAchat(p); const stock=l.uniteStock||uniteStock(p);
    const rep=await customPrompt(`Combien de ${achat} de ${p.nom} avez-vous réellement reçus ? (reste ${reste} ${achat})`,{title:'Réception',defaultValue:String(reste),type:'number',okText:'Continuer'}); if(rep===null)continue;
    const q=Math.floor(Number(rep)); if(!Number.isFinite(q)||q<0||q>reste){showToast(`Quantité invalide pour ${p.nom}`);continue;}
    let facteur=conditionnementConnu(p)?facteurAchat(p):null;
    if(!facteur){
      const contenu=await customPrompt(`Combien de ${stock} contient 1 ${achat} de ${p.nom} ? Comptez un paquet réel puis saisissez le nombre.`,{title:'Contenu à confirmer',defaultValue:'',type:'number',okText:'Mémoriser'}); if(contenu===null)continue;
      facteur=Math.floor(Number(contenu)); if(!Number.isFinite(facteur)||facteur<1){showToast(`Contenu invalide pour ${p.nom}`);continue;}
      p.facteurAchat=facteur; p.conditionnementConfirme=true; l.facteurAchat=facteur; l.conditionnementConfirme=true;
    }
    const base=q*facteur; l.quantiteRecue=(Number(l.quantiteRecue)||0)+q; p.entrees=(Number(p.entrees)||0)+base; enregistrerMouvementStock({produitId:p.id,quantite:base,type:'Réception',reference:c.id,notes:`${q} ${achat} × ${facteur} ${stock}`});
  }
  c.statut=commandeReste(c)<=0?'Réceptionnée':'Réception partielle'; c.dateDerniereReception=todayISO();
  await persist('produits','modification'); await persist('commandes','modification'); await persist('mouvementsStock','creation'); showToast('Réception enregistrée et contenu mémorisé'); render();
}
async function validerCommande(id){
  if(!estProprietaire()){ showToast('Validation réservée au propriétaire'); return; }
  const c=state.commandes.find(x=>x.id===id); if(!c || c.statut!=='Brouillon') return;
  const choix=await customPrompt('Mode de paiement (Espèces, Orange Money, MTN Mobile Money ou Virement)',{title:'Valider et payer la commande',defaultValue:'Espèces',okText:'Valider'});
  if(choix===null)return;
  const mode=String(choix).trim();
  const modes=['Espèces','Orange Money','MTN Mobile Money','Virement'];
  if(!modes.includes(mode)){showToast('Mode de paiement invalide');return;}
  const fournisseur=fournisseurById(c.fournisseurId);
  const dep={id:uid('dep'),date:todayISO(),categorie:'Achat marchandises',description:`Commande ${c.numero} — ${fournisseur?.nom||'Fournisseur'}`,montant:commandeTotal(c),modePaiement:mode,observations:'Sortie liée à la validation de la commande',commandeId:c.id,source:'commande',annulee:false};
  state.depenses.push(dep); c.depenseId=dep.id; c.modePaiement=mode; c.statut='Validée'; c.dateValidation=todayISO();
  await persist('depenses','creation'); await persist('commandes','modification'); showToast('Commande validée et sortie enregistrée'); render();
}
async function annulerCommande(id){
  if(!estProprietaire()){ showToast('Annulation réservée au propriétaire'); return; }
  const c=state.commandes.find(x=>x.id===id); if(!c || c.statut==='Annulée') return;
  if(!await customConfirm('Annuler cette commande ? Les quantités déjà réceptionnées seront retirées du stock et la sortie de trésorerie sera neutralisée.',{title:'Annulation de commande',okText:'Annuler la commande',danger:true}))return;
  let stockModifie=false;
  for(const l of c.lignes||[]){ const q=Math.max(0,Number(l.quantiteRecue||0)); const p=produitById(l.produitId); if(!p||!q)continue; const achat=l.uniteAchat||uniteAchat(p); const stock=l.uniteStock||uniteStock(p); const facteur=Math.max(1,Number(l.facteurAchat)||facteurAchat(p)); const base=q*facteur; p.entrees=Math.max(0,Number(p.entrees||0)-base); enregistrerMouvementStock({produitId:p.id,quantite:-base,type:'Annulation réception',reference:c.id,notes:`Annulation de ${q} ${achat} × ${facteur} ${stock}`}); stockModifie=true; }
  if(c.depenseId){ const d=state.depenses.find(x=>x.id===c.depenseId); if(d){d.annulee=true;d.dateAnnulation=todayISO();} }
  c.statut='Annulée'; c.dateAnnulation=todayISO();
  if(stockModifie) await persist('produits','modification');
  if(stockModifie) await persist('mouvementsStock','creation');
  if(c.depenseId) await persist('depenses','modification');
  await persist('commandes','modification'); showToast('Commande annulée et impacts neutralisés'); render();
}

function attachTresorerieHandlers(){
  document.getElementById('formReglement')?.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const v = state.ventes.find(x=>x.id===fd.get('venteId'));
    if(!v) return;
    const montant = Number(fd.get('montant'))||0;
    const reste = resteVente(v);
    if(montant<=0 || montant>reste){ showToast(`Montant invalide : reste ${fmtGNF(reste)}`); return; }

    v.reglements.push({id:uid('reg'), date:fd.get('date')||todayISO(), montant, modePaiement:fd.get('modePaiement')});
    v.paye = resteVente(v)<=0 ? 'Oui' : 'Non';
    await persist('ventes', 'modification');
    showToast('Règlement enregistré');
    render();
  });

    state.tresorerie.soldeDepart = val;
    await persist('tresorerie', 'modification');
    showToast('Solde de départ enregistré');
    render();
  });
}

function renderJournalList(){

  return `<div class="list">

      const dt = j.horodatage && j.horodatage.toDate ? j.horodatage.toDate() : null;
      const dtTxt = dt ? dt.toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : "À l'instant";

async function chargerEmployes(){
  state.employesLoading = true;
  try{
    const snap = await db.collection('liens_employes').where('ownerUid','==',currentUser.uid).get();
    state.employes = snap.docs.map(d=>({ uid:d.id, ...d.data() }));
  }catch(e){
    console.warn('Liste des employés indisponible', e);
    state.employes = [];
  }
  state.employesLoading = false;
  if(state.activeTab==='employes') render();
}

async function creerEmploye({nom, email, password, role}){
  const a2 = secondaryAuth();
  try{
    const cred = await a2.createUserWithEmailAndPassword(email, password);
    const newUid = cred.user.uid;
    await db.collection('liens_employes').doc(newUid).set({
      ownerUid: currentUser.uid, role, email, nom, suspendu: false,
      creeLe: firebase.firestore.FieldValue.serverTimestamp()
    });
    await a2.signOut();
    return { ok:true };
  }catch(e){
    return { ok:false, message: traduireErreurAuth(e) };
  }
}

async function chargerJournal(){
  state.journalLoading = true;
  try{
    const snap = await db.collection('journal_employes')
      .where('ownerUid','==',currentUser.uid)
      .orderBy('horodatage','desc')
      .limit(50)
      .get();
    state.journal = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  }catch(e){
    console.warn('Journal indisponible', e);
    state.journal = [];
  }
  state.journalLoading = false;
  if(state.activeTab==='employes') render();
}

function attachEmployesHandlers(){
  if(!state.employesLoaded){ state.employesLoaded = true; chargerEmployes(); }
  if(!state.journalLoaded){ state.journalLoaded = true; chargerJournal(); }
  const f = document.getElementById('formEmploye');
  f?.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(f);
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Création…';
    const res = await creerEmploye({
      nom: fd.get('nom').trim(), email: fd.get('email').trim(),
      password: fd.get('password'), role: fd.get('role')
    });
    btn.disabled = false; btn.textContent = 'Créer le compte employé';
    if(res.ok){
      showToast('✅ Accès employé créé');
      f.reset();
      chargerEmployes();
    }else{
      showToast('⚠️ ' + res.message);
    }
  });
  document.querySelectorAll('[data-revoke]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!await customConfirm("Retirer l'accès de cet employé ?", {title:"Retirer l'accès", okText:"Retirer", danger:true})) return;
      try{
        await db.collection('liens_employes').doc(b.dataset.revoke).delete();
        showToast('Accès retiré');
        chargerEmployes();
      }catch(e){ showToast('⚠️ Suppression impossible'); }
    });
  });
  document.querySelectorAll('[data-toggle-suspend]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const suspendre = b.dataset.suspendu === '0';
      const msg = suspendre
        ? "Suspendre cet employé ? Il perdra immédiatement tout accès à vos données jusqu'à réactivation."
        : "Réactiver l'accès de cet employé ?";
      if(!await customConfirm(msg, {title: suspendre?'Suspension':'Réactivation', okText: suspendre?'Suspendre':'Réactiver', danger: suspendre})) return;
      try{
        await db.collection('liens_employes').doc(b.dataset.toggleSuspend).update({ suspendu: suspendre });
        showToast(suspendre ? '⏸️ Employé suspendu' : '▶️ Accès réactivé');
        chargerEmployes();
      }catch(e){ showToast('⚠️ Action impossible'); }
    });
  });
}

function exportBackup(){
  if(!estProprietaire()){ showToast('Sauvegarde réservée au propriétaire'); return; }
  const payload={format:'KlabCenter-backup',version:2,exportedAt:new Date().toISOString(),data:{}};
  Object.keys(KEYS).forEach(k=>{payload.data[k]=state[k];});
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='KlabCenter_sauvegarde_'+todayISO()+'.json'; a.click(); URL.revokeObjectURL(a.href); showToast('Sauvegarde JSON téléchargée');
}
async function importBackup(file){
  if(!estProprietaire()){ showToast('Restauration réservée au propriétaire'); return; }
  if(!file)return;
  try{
    const payload=JSON.parse(await file.text());
    if(payload.format!=='KlabCenter-backup' || !payload.data) throw new Error('Format de sauvegarde invalide');
    if(!await customConfirm('Cette restauration remplacera les données actuelles. Avez-vous téléchargé une sauvegarde récente ?', {title:'Restaurer une sauvegarde',okText:'Restaurer',danger:true})) return;
    for(const k of Object.keys(KEYS)) if(Object.prototype.hasOwnProperty.call(payload.data,k)) state[k]=payload.data[k];
    for(const k of Object.keys(KEYS)) await persist(k,'restauration');
    showToast('Sauvegarde restaurée'); render();
  }catch(e){ console.error(e); showToast('Fichier de sauvegarde invalide'); }
}
async function demarrerBaseReelle(){
  if(!estProprietaire()){ showToast('Nettoyage réservé au propriétaire'); return; }
  const confirmeSauvegarde=await customConfirm('Une sauvegarde JSON sera téléchargée avant le nettoyage. Conservez-la sur un autre appareil.',{title:'Étape 1 — Sauvegarder',okText:'Télécharger et continuer'});
  if(!confirmeSauvegarde)return;
  exportBackup();
  const confirmeSuppression=await customConfirm('Cette action supprimera les clients, produits, services, ventes, dépenses, factures, fournisseurs, commandes et mouvements de test. Les formules et les paramètres de votre entreprise seront conservés. Voulez-vous vraiment commencer la saisie réelle ?',{title:'Étape 2 — Effacer les données de test',okText:'Oui, démarrer proprement',danger:true});
  if(!confirmeSuppression)return;
  const vides={clients:[],produits:[],ventes:[],depenses:[],factures:[],fournisseurs:[],commandes:[],mouvementsStock:[]};
  Object.entries(vides).forEach(([k,v])=>state[k]=v);
  state.tresorerie={soldeDepart:0};
  for(const [k,v] of Object.entries(vides)) await persist(k,'initialisation');
  await persist('tresorerie','initialisation');
  showToast('Base propre : vous pouvez commencer avec vos données réelles');
  render();
}

  return `
    <div class="section-title">Paramètres</div>
    <div class="section-sub">Informations de votre entreprise (utilisées sur les factures)</div>
    <div class="card">
      <form id="formParams" class="form-grid">
        <div class="field full"><label>Nom commercial</label><input name="nom" value="${esc(p.nom)}"></div>
        <div class="field"><label>Téléphone</label><input name="telephone" value="${esc(p.telephone)}"></div>
        <div class="field"><label>Email</label><input name="email" value="${esc(p.email)}"></div>
        <div class="field full"><label>Adresse</label><input name="adresse" value="${esc(p.adresse)}"></div>
        <div class="field"><label>Devise</label><input name="devise" value="${esc(p.devise)}"></div>
        <div class="field"><label>NIF / RCCM</label><input name="nif" value="${esc(p.nif)}"></div>
        <div class="btn-row full"><button type="submit" class="btn btn-primary">Enregistrer</button></div>
      </form>
    </div>
    <div class="helper">Ces données sont stockées de façon sécurisée. Vous pouvez donner un accès limité à des employés depuis l'onglet « Employés ».</div>

    <div class="card" style="margin-top:16px;">
      <h3>📤 Export de vos données</h3>
      <div class="section-sub" style="margin-top:-6px;">Téléchargez un fichier Excel avec vos clients, produits, ventes et dépenses — utile pour votre comptabilité ou une sauvegarde personnelle.</div>
      <button class="btn btn-primary btn-block" id="btnExportExcel">⬇️ Exporter en Excel</button>
    </div>
    <div class="card" style="margin-top:16px;">
      <h3>🛡️ Sauvegarde complète</h3>
      <div class="section-sub" style="margin-top:-6px;">La sauvegarde JSON contient les clients, produits, ventes, règlements, fournisseurs, commandes, dépenses et mouvements de stock.</div>
      <button class="btn btn-primary btn-block" id="btnExportBackup">⬇️ Télécharger une sauvegarde complète</button>
      <input id="inputImportBackup" type="file" accept="application/json,.json" style="display:none">
      <button class="btn btn-ghost btn-block" id="btnImportBackup">↥ Restaurer une sauvegarde</button>
      <div class="helper">Conservez le fichier sur un autre appareil. La restauration remplace les données actuelles après confirmation.</div>
    </div>
    ${estProprietaire()?`<div class="card" style="margin-top:16px;border:1px solid #f0b6b6;"><h3>🚀 Démarrer avec les données réelles</h3><div class="section-sub" style="margin-top:-6px;">Télécharge d’abord une sauvegarde, puis efface les données de test. Les formules, les paramètres de l’entreprise et la structure de l’application restent conservés.</div><button class="btn btn-danger btn-block" id="btnDemarrerBaseReelle">Effacer les données de test et commencer</button><div class="helper">À utiliser une seule fois, lorsque toutes les données actuelles sont des essais.</div></div>`:''}

    <button class="btn btn-ghost btn-block" id="btnLogout" style="margin-top:14px;">🚪 Se déconnecter</button>
  `;
}
function exportToExcel(){
  try{
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
      state.clients.map(c=>({ Nom:c.nom, 'Téléphone':c.telephone||'', Email:c.email||'', Adresse:c.adresse||'', 'Total achats (GNF)': totalAchatsClient(c.id) }))
    ), 'Clients');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
      state.produits.map(p=>({ Nom:p.nom, Catégorie:p.categorie||'', Type:p.type, 'Unité achat':p.type==='Service'?'—':uniteAchat(p), 'Unités stock / conditionnement':p.type==='Service'?'—':facteurAchat(p), 'Prix (GNF)':p.prix||0, 'Stock actuel': p.type==='Service'?'—':stockActuel(p), Statut: statutStock(p) }))
    ), 'Produits');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
      state.ventes.map(v=>{
        const p=produitById(v.produitId), c=clientById(v.clientId);
        return { Date:v.date, Client: c?c.nom:'Client de passage', Produit: p?p.nom:'—', Quantité:v.quantite, 'Prix unitaire (GNF)':v.prixUnitaire, 'Chiffre d’affaires (GNF)':ventesTotal(v), 'Réglé (GNF)':montantRegle(v), 'Reste dû (GNF)':resteVente(v), 'Mode initial':v.modePaiement, 'Statut':resteVente(v)<=0?'Réglé':'À recouvrer', 'Règlements':reglementsVente(v).map(r=>`${r.date} ${r.montant} ${r.modePaiement}`).join(' | ') };
      })
    ), 'Ventes');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
      state.depenses.map(d=>({ Date:d.date, Catégorie:d.categorie, Description:d.description, 'Montant (GNF)':d.montant, 'Mode de paiement':d.modePaiement }))
    ), 'Dépenses');
    XLSX.writeFile(wb, `KlabCenter_export_${todayISO()}.xlsx`);
    showToast('Export Excel généré');
  }catch(e){
    console.error(e);
    showToast("Export impossible sur cet appareil.");
  }
}
function attachParametresHandlers(){
  document.getElementById('btnExportExcel')?.addEventListener('click', exportToExcel);
  document.getElementById('btnExportBackup')?.addEventListener('click', exportBackup);
  document.getElementById('btnDemarrerBaseReelle')?.addEventListener('click', demarrerBaseReelle);
  document.getElementById('btnImportBackup')?.addEventListener('click', ()=>document.getElementById('inputImportBackup')?.click());
  document.getElementById('inputImportBackup')?.addEventListener('change', e=>importBackup(e.target.files?.[0]));
  document.getElementById('btnLogout')?.addEventListener('click', async ()=>{
    if(await customConfirm('Se déconnecter de votre compte KlabCenter ?', {title:'Déconnexion', okText:'Se déconnecter'})) await logout();
  });
  const f = document.getElementById('formParams');
  f?.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(f);
    state.parametres = {
      nom: fd.get('nom').trim(), telephone: fd.get('telephone').trim(), email: fd.get('email').trim(),
      adresse: fd.get('adresse').trim(), devise: fd.get('devise').trim()||'GNF', nif: fd.get('nif').trim()
    };
    await persist('parametres');
    showToast('Paramètres enregistrés');
    render();
  });
}

/* ============================================================
   INIT — voir onAuthStateChanged plus haut, qui déclenche loadAll()
   une fois l'utilisateur authentifié.
   ============================================================ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW non enregistré', e));
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(refreshing) return;
      refreshing = true;
      if(hadController) showUpdateBanner();
    });
  });
}

function showUpdateBanner(){
  if(document.getElementById('updateBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBanner';
  bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:14px;z-index:9999;background:#132C54;color:#fff;padding:12px 14px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px;font-family:Inter,sans-serif;';
  bar.innerHTML = '<span>🔄 Nouvelle version disponible</span><button id="btnReloadUpdate" style="background:#4F86F7;border:none;color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer;">Recharger</button>';
  document.body.appendChild(bar);
  document.getElementById('btnReloadUpdate').addEventListener('click', ()=> location.reload());
}
